<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <title>User Login</title>
</head>
<!-- The body is now a full-screen Flexbox container that centers its contents -->
<body style="font-family: Arial; margin: 0; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; min-height: 100vh;">

<div style="width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin: 20px;">
    <h2 style="text-align: center; margin-bottom: 20px;">User Login</h2>

    <!-- Dynamic Error Notification -->
    <div th:if="${param.error}" style="color: white; background-color: #d9534f; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
        Invalid email or password.
    </div>

    <!-- Dynamic Success Notification -->
    <div th:if="${param.success}" style="color: white; background-color: #5cb85c; padding: 10px; border-radius: 4px; margin-bottom: 15px; font-size: 14px;">
        Registration successful! Please log in.
    </div>

    <form th:action="@{/login}" method="post">

        <label><strong>Email:</strong></label><br>
        <input type="email"
               name="username"
               required
               style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"><br>
        <br>

        <label><strong>Password:</strong></label><br>
        <input type="password"
               name="password"
               required
               style="width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box;"><br>
        <br><br>

        <button type="submit" style="width: 100%; background-color: #0275d8; color: white; padding: 10px; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">Login</button>
    </form>

    <p style="text-align: center; margin-top: 15px; font-size: 14px;">Don't have an account? <a href="/register">Register here</a></p>
</div>

</body>
</html>
